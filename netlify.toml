[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"

# SSR is a Netlify Function generated by Nitro. Do not add a /* → /index.html rewrite.

[context.production.environment]
  # Set these in the Netlify UI, not in this file:
  # VITE_AUTH0_DOMAIN
  # VITE_AUTH0_CLIENT_ID
  # VITE_AUTH0_AUDIENCE = https://identity.megazear7.com
  # VITE_IDENTITY_URL = https://identity.megazear7.com/data
