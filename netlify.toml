[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"
  # Auth0 SPA client id is public by design and Vite inlines VITE_* into the
  # browser/SSR bundle. Omit it so Netlify secrets scanning does not fail the build.
  SECRETS_SCAN_OMIT_KEYS = "VITE_AUTH0_CLIENT_ID,VITE_AUTH0_DOMAIN,VITE_AUTH0_AUDIENCE,VITE_IDENTITY_URL"

# SSR is a Netlify Function generated by Nitro. Do not add a /* → /index.html rewrite.

[context.production.environment]
  # Set these in the Netlify UI, not in this file:
  # VITE_AUTH0_DOMAIN
  # VITE_AUTH0_CLIENT_ID
  # VITE_AUTH0_AUDIENCE = https://identity.megazear7.com
  # VITE_IDENTITY_URL = https://identity.megazear7.com/data
